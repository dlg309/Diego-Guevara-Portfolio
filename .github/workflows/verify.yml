name: Verify portfolio

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm ci
      - name: Ensure maintenance test tooling is present
        run: jq --version
      - run: npm run check
      - run: npm test
      - run: npm run deadcode
      - run: npm run assets:check
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm run size
