name: Verify portfolio

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci
      - name: Ensure maintenance test tooling is present
        run: jq --version
      - run: npm run check
      - run: npm test
      - run: npm run deadcode
      - run: npm run assets:check
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm run size
