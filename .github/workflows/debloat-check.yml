name: Dead code and bundle budget
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debloat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run deadcode
      - run: npm run assets:check
      - run: npm run build
      - name: Enforce Size Limit budgets
        run: npm run size
      - name: Build PR base for comparison
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .baseline
          persist-credentials: false
      - name: Measure PR base
        if: github.event_name == 'pull_request'
        working-directory: .baseline
        run: |
          npm ci
          npm run build
      - name: Report sizes and PR delta
        if: always()
        run: npm run metrics
