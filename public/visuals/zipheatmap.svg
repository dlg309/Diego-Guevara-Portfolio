  <path d="M199 246h89m144 0h89" fill="none" stroke="#a6917c" stroke-width="3" stroke-linecap="round"/>
  <path d="m279 237 9 9-9 9m233-18 9 9-9 9" fill="none" stroke="#a6917c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
