<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Diego Guevara — Portfolio preview</title>
  <style>
    * { box-sizing: border-box; }
    body { width: 1200px; height: 630px; margin: 0; padding: 62px 68px; overflow: hidden; background: #090d15; color: #f1f5fb; font-family: Arial, Helvetica, sans-serif; }
    header { display: flex; align-items: center; gap: 20px; font-size: 27px; font-weight: 700; }
    .mark { display: grid; place-items: center; width: 62px; height: 62px; border: 1px solid #637ea4; border-radius: 8px; background: #101b2d; color: #a9caff; }
    main { display: grid; grid-template-columns: 1fr 270px; gap: 32px; align-items: center; margin-top: 70px; }
    h1 { margin: 0; font-size: 66px; line-height: 1.13; letter-spacing: -3px; }
    h1 span { color: #a9caff; }
    p { margin: 24px 0 0; color: #b8c5d8; font-size: 23px; line-height: 1.5; }
    .areas { display: grid; gap: 16px; }
    .areas div { padding: 21px 24px; border: 1px solid #344966; border-left: 3px solid #a9caff; border-radius: 7px; background: #101b2d; font-size: 22px; }
    footer { margin-top: 65px; color: #9aacc4; font-size: 18px; letter-spacing: .5px; }
  </style>
</head>
<body>
  <header><span class="mark">DG.</span>Diego Guevara</header>
  <main>
    <div><h1>Business thinking.<br><span>Practical software.</span></h1><p>Business &amp; Information Systems · NJIT<br>Software and data tools for useful work.</p></div>
    <div class="areas"><div>Software</div><div>Data</div><div>Business operations</div></div>
  </main>
  <footer>dlg309.github.io/Diego-Guevara-Portfolio</footer>
</body>
</html>
